<!-- Main Container -->
<div class="container my-5" style="background-color: white; padding: 2rem; border-radius: 8px;" *ngIf="producto">
  
  <div class="row g-5 align-items-center">
    
    <!-- Imagen del Producto -->
    <div class="col-md-6">
      <div class="position-relative">
        <span class="position-absolute top-0 start-0 m-3 p-2 bg-white rounded-circle d-flex align-items-center justify-content-center" 
              style="width: 40px; height: 40px; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.1); z-index: 10;"
              (click)="toggleLike()"
              [class.heart-pop]="animateHeart">
          <!-- Comentario: Muestra un corazón relleno si tiene 'like', o vacío si no -->
          <i class="bi text-danger" [ngClass]="isLiked ? 'bi-heart-fill' : 'bi-heart'"></i>
        </span>
        <img [src]="producto.image" [alt]="producto.name" class="img-fluid rounded" style="width: 100%; object-fit: cover; max-height: 500px;">
      </div>
    </div>

    <!-- Detalles del Producto -->
    <div class="col-md-6">
      <div class="card card-lowlife p-4 border-0 h-100" style="box-shadow: 0 0 10px rgba(0,0,0,0.1);">
        <h2 class="mb-3 fw-bold">{{ producto.name }}</h2>
        <div class="mb-2">
          <span class="badge bg-success text-success bg-opacity-25 border border-success border-opacity-50">Verificado</span>
        </div>
        <div class="mb-4">
          <span class="fs-1 fw-bold">€{{ producto.price }}</span>
        </div>

        <div class="row mb-4">
          <div class="col-6" *ngIf="availableSizes.length > 0">
            <label class="form-label text-muted">Talla:</label>
            <select class="form-select" [(ngModel)]="selectedSize">
              <option *ngFor="let size of availableSizes" [value]="size">{{ size }}</option>
            </select>
          </div>
          <div class="col-6" *ngIf="availableColors.length > 0">
            <label class="form-label text-muted">Color:</label>
            <select class="form-select" [(ngModel)]="selectedColor">
              <option *ngFor="let color of availableColors" [value]="color">{{ color }}</option>
            </select>
          </div>
        </div>

        <!-- Indicador de Stock (Opcional, pero ayuda al usuario) -->
        <div class="mb-3" *ngIf="availableSizes.length > 0 || availableColors.length > 0">
          <span class="badge" [ngClass]="currentStock > 0 ? 'bg-success bg-opacity-25 text-success border border-success border-opacity-50' : 'bg-danger bg-opacity-25 text-danger border border-danger border-opacity-50'">
            {{ currentStock > 0 ? 'En Stock' : 'Agotado' }}
          </span>
        </div>

        <div class="product-actions d-flex gap-3 mb-4">
          <button class="btn btn-primary add-to-cart-btn flex-grow-1 py-2 fw-bold fs-5" 
                  style="border-radius: 4px;" 
                  (click)="addToCart()"
                  [disabled]="(availableSizes.length > 0 || availableColors.length > 0) && currentStock === 0">
            <i class="bi bi-cart-plus me-2"></i> 
            {{ ((availableSizes.length > 0 || availableColors.length > 0) && currentStock === 0) ? 'Agotado' : 'Añadir al carro' }}
          </button>
          
          <!-- Comentario: Botón grande para dar like/deseados -->
          <button class="btn btn-outline-danger shadow-sm like-btn d-flex justify-content-center align-items-center" 
                  (click)="toggleLike()" 
                  style="width: 55px; border-radius: 8px;"
                  [class.heart-pop]="animateHeart">
            <i class="bi fs-5" [ngClass]="isLiked ? 'bi-heart-fill' : 'bi-heart'"></i>
          </button>
        </div>

        <div class="border rounded p-3 text-muted">
          {{ producto['descripcion'] || 'Sin descripción adicional.' }}
        </div>
      </div>
    </div>

  </div>


</div>
