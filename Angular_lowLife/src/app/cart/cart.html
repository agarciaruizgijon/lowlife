<div class="cart-wrapper">
  <div class="container py-5 d-flex flex-column align-items-center">
    
    <!-- Cart Card -->
    <div class="cart-box mb-5 w-100" style="max-width: 800px;">
      <h1 class="fw-bold text-center mb-4">Carrito</h1>
      
      <div *ngIf="cesta.length === 0" class="text-center">
        <h3 class="fw-normal mb-0">Su carrito está vacío</h3>
      </div>

      <div *ngIf="cesta.length > 0">
        <ul class="list-group mb-4">
          <li class="list-group-item d-flex justify-content-between align-items-center" *ngFor="let item of cesta">
            <div class="d-flex align-items-center">
              <img *ngIf="item.producto?.foto_url" [src]="item.producto.foto_url" style="width: 50px; height: 50px; object-fit: cover; margin-right: 15px; border-radius: 4px;">
              <div>
                <h5 class="mb-0">{{ item.producto?.titulo || 'Producto' }}</h5>
                <small class="text-muted d-block" *ngIf="item.color">Color: <span class="d-inline-block rounded-circle align-middle ms-1" [style.background-color]="item.color" [style.width.px]="12" [style.height.px]="12" [title]="item.color"></span> {{ item.color }}</small>
                <small class="text-muted d-block" *ngIf="item.talla">Talla: {{ item.talla }}</small>
                <small class="text-muted d-block">Cantidad: {{ item.cantidad }}</small>
              </div>
            </div>
            <div class="d-flex align-items-center gap-3">
              <span class="fs-5 fw-bold">€{{ item.producto?.precio * item.cantidad | number:'1.2-2' }}</span>
              <button class="btn btn-outline-danger btn-sm rounded-circle shadow-sm" (click)="removeItem(item)" title="Eliminar producto" style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;">
                <i class="bi bi-trash"></i>
              </button>
            </div>
          </li>
        </ul>
        <div class="d-flex justify-content-between align-items-center border-top pt-3">
          <h4 class="fw-bold m-0">Total</h4>
          <h3 class="fw-bold text-primary m-0">€{{ total | number:'1.2-2' }}</h3>
        </div>
        <button class="btn btn-dark w-100 mt-4 py-2 fs-5">Proceder al pago</button>
      </div>

    </div>

  </div>
</div>
