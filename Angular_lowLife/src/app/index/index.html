  <!-- Main Content Layout -->
  <div class="main-wrapper">
    
    <!-- Left Sidebar (Filters) -->
    <aside class="sidebar-wrapper d-none d-md-block">
      <div class="card-filter">
        <!-- Categorías -->
        <div class="filter-section">
          <div class="filter-title">Categorías:</div>
          <div class="d-flex flex-wrap">
            <span class="badge-category">Reloj <i class="bi bi-x"></i></span>
            <span class="badge-category">Zapato <i class="bi bi-x"></i></span>
            <span class="badge-category">Sudadera <i class="bi bi-x"></i></span>
          </div>
        </div>

        <!-- Tallas -->
        <div class="filter-section">
          <div class="filter-title">Tallas:</div>
          <label class="custom-checkbox">
            <input type="checkbox" checked>
            XS-S
          </label>
          <label class="custom-checkbox">
            <input type="checkbox" checked>
            M
          </label>
          <label class="custom-checkbox">
            <input type="checkbox" checked>
            L
          </label>
          <label class="custom-checkbox">
            <input type="checkbox" checked>
            XL
          </label>
        </div>

        <!-- Precio -->
        <div class="filter-section">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <span class="filter-title mb-0">Precio:</span>
            <span class="text-dark fw-medium" style="font-size: 0.9rem;">0-{{maxPrice}}€</span>
          </div>
          <input type="range" class="form-range price-range" min="0" max="300" [value]="maxPrice" (input)="updatePrice($event)">
        </div>

        <!-- Color -->
        <div class="filter-section">
          <div class="filter-title">Color:</div>
          <label class="custom-checkbox color-swatch-container">
            <input type="checkbox" checked>
            <span class="color-swatch" style="background-color: #ff5722;"></span>
          </label>
          <label class="custom-checkbox color-swatch-container">
            <input type="checkbox" checked>
            <span class="color-swatch" style="background-color: #f48fb1;"></span>
          </label>
          <label class="custom-checkbox color-swatch-container">
            <input type="checkbox" checked>
            <span class="color-swatch" style="background-color: #42a5f5;"></span>
          </label>
        </div>
      </div>
    </aside>

    <!-- Right Content Area (Products) -->
    <main class="content-area">
      <div class="container-fluid px-0">
        
        <!-- Sorting Buttons -->
        <div class="top-actions">
          <button class="btn btn-sort" [class.active]="activeSort === 'destacado'" (click)="sortArticles('destacado')"><i class="bi bi-check2 me-1" *ngIf="activeSort === 'destacado'"></i> Destacado</button>
          <button class="btn btn-sort" [class.active]="activeSort === 'mayor_precio'" (click)="sortArticles('mayor_precio')"><i class="bi bi-check2 me-1" *ngIf="activeSort === 'mayor_precio'"></i> Mayor Precio</button>
          <button class="btn btn-sort" [class.active]="activeSort === 'menor_precio'" (click)="sortArticles('menor_precio')"><i class="bi bi-check2 me-1" *ngIf="activeSort === 'menor_precio'"></i> Menor Precio</button>
          <button class="btn btn-sort" [class.active]="activeSort === 'valoraciones'" (click)="sortArticles('valoraciones')"><i class="bi bi-check2 me-1" *ngIf="activeSort === 'valoraciones'"></i> Valoraciones</button>
        </div>

        <!-- Product Grid -->
        <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 row-cols-xl-4 g-4 mb-5">
          
          <!-- Dynamic Products -->
          <div class="col" *ngFor="let articulo of articulos">
            <div class="product-card" routerLink="/producto" style="cursor: pointer;">
              <div class="product-img-wrapper">
                <img [src]="articulo.image" [alt]="articulo.name" class="product-img">
              </div>
              <div class="product-info">
                <div class="product-title-price">
                  <h3 class="product-title">{{ articulo.name }}</h3>
                  <span class="product-price">{{ articulo.price }}€</span>
                </div>
                <div class="product-colors">
                  <div class="product-color-dot" *ngFor="let color of articulo.colors" [style.background-color]="color"></div>
                </div>
              </div>
            </div>
          </div>

        </div>
      </div>
    </main>
  </div>
