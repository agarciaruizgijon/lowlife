  <!-- Main Content Layout -->
  <div class="main-wrapper">
    
    <!-- Left Sidebar (Filters) -->
    <aside class="sidebar-wrapper d-none d-md-block">
      <div class="card-filter">
        <!-- Categorías: Mostradas como badges clicables -->
        <div class="filter-section">
          <div class="filter-title"><i class="bi bi-tags me-2"></i>Categorías:</div>
          <div class="d-flex flex-wrap gap-2">
            <!-- Iteramos sobre las categorías ordenadas alfabéticamente -->
            <span class="badge-category"
                  *ngFor="let cat of availableCategories" 
                  [class.selected]="selectedCategories.includes(cat)"
                  (click)="toggleCategory(cat)">
              {{ cat }} <i class="bi bi-check-circle-fill ms-1" *ngIf="selectedCategories.includes(cat)"></i>
            </span>
          </div>
        </div>

        <!-- Tallas: Ahora mostradas como botones tipo "pill" en lugar de checkboxes genéricos -->
        <div class="filter-section">
          <div class="filter-title"><i class="bi bi-rulers me-2"></i>Tallas:</div>
          <div class="d-flex flex-wrap gap-2">
            <!-- Iteramos sobre las tallas en orden lógico (XS a XXL) -->
            <span class="badge-size"
                  *ngFor="let size of availableSizes"
                  [class.selected]="selectedSizes.includes(size)"
                  (click)="toggleSize(size)">
              {{ size }}
            </span>
          </div>
        </div>

        <!-- Precio: Rango visual interactivo -->
        <div class="filter-section">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <span class="filter-title mb-0"><i class="bi bi-currency-euro me-2"></i>Precio:</span>
            <!-- Etiqueta de precio dinámica -->
            <span class="badge-price">0 - {{maxPrice}}€</span>
          </div>
          <input type="range" class="form-range price-range" min="0" max="300" [value]="maxPrice" (input)="updatePrice($event)">
        </div>

        <!-- Color: Círculos de colores que se iluminan al seleccionarse, ocultando el checkbox nativo -->
        <div class="filter-section">
          <div class="filter-title"><i class="bi bi-palette me-2"></i>Color:</div>
          <div class="d-flex flex-wrap gap-2">
            <!-- Los colores están ordenados alfabéticamente -->
            <label class="color-swatch-wrapper" *ngFor="let color of baseColors" [title]="color.name" [class.selected]="selectedColors.includes(color.name)">
              <input type="checkbox" class="d-none" [checked]="selectedColors.includes(color.name)" (change)="toggleColor(color.name)">
              <span class="color-swatch" [style.background-color]="color.hex"></span>
            </label>
          </div>
        </div>
      </div>
    </aside>

    <!-- Right Content Area (Products) -->
    <main class="content-area">
      <div class="container-fluid px-0">
        
        <div *ngIf="toastMessage" class="alert alert-success alert-dismissible fade show m-3" role="alert">
          {{ toastMessage }}
          <button type="button" class="btn-close" (click)="toastMessage = null" aria-label="Close"></button>
        </div>

        <!-- Sorting Buttons -->
        <div class="top-actions">
          <button class="btn btn-filter-mobile d-md-none" (click)="openFilterModal()">
            <i class="bi bi-sliders me-2"></i>Filtros
          </button>
          <button class="btn btn-sort" [class.active]="activeSort === 'destacado'" (click)="sortArticles('destacado')"><i class="bi bi-check2 me-1" *ngIf="activeSort === 'destacado'"></i> Destacado</button>
          <button class="btn btn-sort" [class.active]="activeSort === 'mayor_precio'" (click)="sortArticles('mayor_precio')"><i class="bi bi-check2 me-1" *ngIf="activeSort === 'mayor_precio'"></i> Mayor Precio</button>
          <button class="btn btn-sort" [class.active]="activeSort === 'menor_precio'" (click)="sortArticles('menor_precio')"><i class="bi bi-check2 me-1" *ngIf="activeSort === 'menor_precio'"></i> Menor Precio</button>
          <button class="btn btn-sort" [class.active]="activeSort === 'valoraciones'" (click)="sortArticles('valoraciones')"><i class="bi bi-check2 me-1" *ngIf="activeSort === 'valoraciones'"></i> Valoraciones</button>
        </div>

        <!-- Product Grid -->
        <div class="row row-cols-2 row-cols-sm-2 row-cols-lg-3 row-cols-xl-4 g-3 g-sm-4 mb-5">
          
          <!-- Dynamic Products -->
          <div class="col" *ngFor="let articulo of articulos">
            <!-- Comentario: Si el artículo no tiene stock, no le pasamos routerLink para que no pueda entrar y cambiamos el cursor -->
            <div class="product-card" [routerLink]="articulo.stock > 0 ? ['/producto', articulo.id] : null" [style.cursor]="articulo.stock > 0 ? 'pointer' : 'not-allowed'">
              <div class="product-img-wrapper" style="position: relative;">
                <!-- Comentario: Overlay para mostrar una raya cruzada (tachada) sobre la imagen si no hay stock -->
                <div *ngIf="articulo.stock === 0" style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center; z-index: 1; overflow: hidden; border-radius: 8px;">
                   <div style="width: 150%; height: 3px; background-color: #dc3545; transform: rotate(-45deg); opacity: 0.8;"></div>
                </div>
                <!-- Comentario: Atenuamos la imagen si no hay stock -->
                <img [src]="articulo.image" [alt]="articulo.name" class="product-img" [style.opacity]="articulo.stock === 0 ? '0.6' : '1'">
              </div>
              <div class="product-info">
                <div class="product-title-price">
                  <!-- Comentario: Título del producto con etiqueta de sin stock en rojo si corresponde -->
                  <h3 class="product-title">
                    {{ articulo.name }}
                    <span *ngIf="articulo.stock === 0" class="text-danger ms-1" style="font-size: 0.85rem; font-weight: bold;">Sin stock</span>
                  </h3>
                  <span class="product-price">{{ articulo.price }}€</span>
                </div>
                <div class="product-colors">
                  <div class="product-color-dot" *ngFor="let color of articulo.colors" [style.background-color]="color.hex || color" [title]="color.name || color"></div>
                </div>
              </div>
            </div>
          </div>

        </div>
      </div>
    </main>
  </div>

  <!-- Mobile Filter Modal -->
  <div class="filter-modal-overlay" [class.active]="isFilterModalOpen" (click)="closeFilterModal()"></div>
  <div class="filter-modal-drawer" [class.active]="isFilterModalOpen">
    <div class="filter-modal-header">
      <h5 class="filter-modal-title"><i class="bi bi-sliders me-2"></i>Filtros</h5>
      <button class="filter-modal-close" (click)="closeFilterModal()">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>
    <div class="filter-modal-body">

      <!-- Categorías: Mostradas como badges clicables -->
      <div class="filter-section">
        <div class="filter-title"><i class="bi bi-tags me-2"></i>Categorías:</div>
        <div class="d-flex flex-wrap gap-2">
          <!-- Iteramos sobre las categorías ordenadas alfabéticamente -->
          <span class="badge-category"
                *ngFor="let cat of availableCategories" 
                [class.selected]="selectedCategories.includes(cat)"
                (click)="toggleCategory(cat)">
            {{ cat }} <i class="bi bi-check-circle-fill ms-1" *ngIf="selectedCategories.includes(cat)"></i>
          </span>
        </div>
      </div>

      <!-- Tallas: Ahora mostradas como botones tipo "pill" en lugar de checkboxes genéricos -->
      <div class="filter-section">
        <div class="filter-title"><i class="bi bi-rulers me-2"></i>Tallas:</div>
        <div class="d-flex flex-wrap gap-2">
          <!-- Iteramos sobre las tallas en orden lógico (XS a XXL) -->
          <span class="badge-size"
                *ngFor="let size of availableSizes"
                [class.selected]="selectedSizes.includes(size)"
                (click)="toggleSize(size)">
            {{ size }}
          </span>
        </div>
      </div>

      <!-- Precio: Rango visual interactivo -->
      <div class="filter-section">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <span class="filter-title mb-0"><i class="bi bi-currency-euro me-2"></i>Precio:</span>
          <!-- Etiqueta de precio dinámica -->
          <span class="badge-price">0 - {{maxPrice}}€</span>
        </div>
        <input type="range" class="form-range price-range" min="0" max="300" [value]="maxPrice" (input)="updatePrice($event)">
      </div>

      <!-- Color: Círculos de colores que se iluminan al seleccionarse, ocultando el checkbox nativo -->
      <div class="filter-section">
        <div class="filter-title"><i class="bi bi-palette me-2"></i>Color:</div>
        <div class="d-flex flex-wrap gap-2">
          <!-- Los colores están ordenados alfabéticamente -->
          <label class="color-swatch-wrapper" *ngFor="let color of baseColors" [title]="color.name" [class.selected]="selectedColors.includes(color.name)">
            <input type="checkbox" class="d-none" [checked]="selectedColors.includes(color.name)" (change)="toggleColor(color.name)">
            <span class="color-swatch" [style.background-color]="color.hex"></span>
          </label>
        </div>
      </div>

    </div>
    <div class="filter-modal-footer">
      <button class="btn btn-apply-filters w-100" (click)="closeFilterModal()">
        <i class="bi bi-check2 me-2"></i>Aplicar Filtros
      </button>
    </div>
  </div>
