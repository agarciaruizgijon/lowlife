<div class="container my-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="fw-bold mb-0">Editar Producto</h1>
    <a routerLink="/admin-productos" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-2"></i>Volver</a>
  </div>

  <form (ngSubmit)="onSubmit()" #productForm="ngForm">
    <div class="row g-4">
      <!-- Columna Principal -->
      <div class="col-lg-8">
        <div class="card card-lowlife border-0 shadow-sm mb-4">
          <div class="card-body p-4">
            <h4 class="mb-4">Información General</h4>
            
            <div class="mb-4">
              <label class="form-label text-muted small fw-bold">Título del Producto</label>
              <input type="text" class="form-control form-control-underline" name="titulo" [(ngModel)]="producto.titulo" placeholder="Ej. Camiseta Oversize Negra" required>
            </div>

            <div class="mb-4">
              <label class="form-label text-muted small fw-bold">Descripción del Producto</label>
              <textarea class="form-control" name="descripcion" [(ngModel)]="producto.descripcion" rows="4" placeholder="Describe las características, material y detalles del producto..." required></textarea>
            </div>

            <div class="row">
              <div class="col-md-6 mb-4">
                <label class="form-label text-muted small fw-bold">Precio (€)</label>
                <input type="number" step="0.01" name="precio" [(ngModel)]="producto.precio" class="form-control form-control-underline" placeholder="0.00" required>
              </div>
              <div class="col-md-6 mb-4">
                <label class="form-label text-muted small fw-bold">Stock (Cantidad)</label>
                <input type="number" name="stock" [(ngModel)]="producto.stock" class="form-control form-control-underline" placeholder="0" required>
              </div>
            </div>
          </div>
        </div>

        <div class="card card-lowlife border-0 shadow-sm mb-4">
          <div class="card-body p-4">
            <h4 class="mb-4">Variantes</h4>

            <div class="mb-4">
              <label class="form-label text-muted small fw-bold d-block">Tallas Disponibles</label>
              <div class="d-flex flex-wrap gap-2" role="group">
                <div *ngFor="let talla of tallasOptions">
                  <input type="checkbox" class="btn-check" [id]="'talla'+talla" (change)="toggleTalla(talla)" [checked]="selectedTallas.includes(talla)" autocomplete="off">
                  <label class="btn btn-outline-dark" [for]="'talla'+talla">{{ talla }}</label>
                </div>
              </div>
            </div>

            <div class="mb-4">
              <label class="form-label text-muted small fw-bold d-block">Añadir Colores</label>
              
              <div class="d-flex align-items-center gap-2 mb-3">
                <input type="color" class="form-control form-control-color" [(ngModel)]="currentColor" name="currentColor" id="colorPicker">
                <button type="button" class="btn btn-secondary" (click)="addColor()">Añadir Color</button>
              </div>

              <div class="d-flex gap-3 flex-wrap">
                <div *ngFor="let color of selectedColors" class="position-relative">
                  <div class="color-circle border border-secondary border-opacity-25" [style.background-color]="color" [title]="color"></div>
                  <button type="button" class="btn btn-danger btn-sm position-absolute top-0 start-100 translate-middle rounded-circle p-0" style="width: 20px; height: 20px; line-height: 1;" (click)="removeColor(color)">&times;</button>
                </div>
              </div>
              <small class="text-muted mt-2 d-block" *ngIf="selectedColors.length === 0">No se han seleccionado colores.</small>
            </div>
          </div>
        </div>

        <div class="card card-lowlife border-0 shadow-sm mb-4">
          <div class="card-body p-4">
            <h4 class="mb-4">Información del Proveedor</h4>
            <div class="row">
              <div class="col-md-6 mb-4">
                <label class="form-label text-muted small fw-bold">Nombre del Proveedor</label>
                <input type="text" name="proveedor_nombre" [(ngModel)]="producto.proveedor_nombre" class="form-control form-control-underline" placeholder="Ej. Textil SL">
              </div>
              <div class="col-md-6 mb-4">
                <label class="form-label text-muted small fw-bold">Email del Proveedor</label>
                <input type="email" name="proveedor_email" [(ngModel)]="producto.proveedor_email" class="form-control form-control-underline" placeholder="contacto@proveedor.com">
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Columna Lateral -->
      <div class="col-lg-4">
        <div class="card card-lowlife border-0 shadow-sm mb-4">
          <div class="card-body p-4">
            <h4 class="mb-4">Estado y Categoría</h4>
            
            <div class="mb-4">
              <label class="form-label text-muted small fw-bold">Estado</label>
              <select name="estado" [(ngModel)]="producto.estado" class="form-select">
                <option value="draft">Borrador</option>
                <option value="active">Activo (Público)</option>
                <option value="inactive">Inactivo</option>
              </select>
            </div>

            <div class="mb-4">
              <label class="form-label text-muted small fw-bold">Categoría</label>
              <select name="categoria" [(ngModel)]="producto.categoria" class="form-select">
                <option value="" disabled>Seleccionar categoría...</option>
                <option value="camisetas">Camisetas</option>
                <option value="sudaderas">Sudaderas</option>
                <option value="pantalones">Pantalones</option>
                <option value="accesorios">Accesorios</option>
              </select>
            </div>
          </div>
        </div>

        <div class="card card-lowlife border-0 shadow-sm mb-4">
          <div class="card-body p-4">
            <h4 class="mb-4">Foto del Producto</h4>
            
            <div class="mb-4">
              <label class="form-label text-muted small fw-bold">URL de la imagen (Opcional)</label>
              <input type="url" name="foto_url" [(ngModel)]="producto.foto_url" class="form-control form-control-underline mb-3" placeholder="https://ejemplo.com/imagen.jpg">
              
              <div class="text-center">
                <span class="text-muted small fw-bold">O sube una imagen local</span>
              </div>
              
              <label class="mt-3 border border-2 border-dashed rounded p-4 text-center bg-light cursor-pointer d-block position-relative" style="transition: all 0.2s;">
                <ng-container *ngIf="!imagePreview">
                  <i class="bi bi-cloud-arrow-up fs-1 text-secondary"></i>
                  <p class="mb-0 mt-2 text-muted small">Haz clic o arrastra una imagen aquí</p>
                </ng-container>
                <img *ngIf="imagePreview" [src]="imagePreview" class="img-fluid rounded" style="max-height: 200px;">
                <input type="file" class="d-none" accept="image/*" (change)="onFileSelected($event)">
              </label>
            </div>
          </div>
        </div>

        <div class="d-grid gap-2">
          <button type="submit" [disabled]="!productForm.form.valid" class="btn btn-primary btn-lg fw-bold">Guardar Cambios</button>
          <button type="button" class="btn btn-outline-danger fw-bold" routerLink="/admin-productos">Descartar</button>
        </div>
      </div>
    </div>
  </form>
</div>
