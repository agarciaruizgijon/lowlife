<div class="container my-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="fw-bold mb-0">Editar Usuario</h1>
    <a routerLink="/admin-gestionUsuario" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-2"></i>Volver</a>
  </div>

  <form (ngSubmit)="saveChanges()">
    <div class="row g-4">
      <!-- Columna Principal -->
      <div class="col-lg-8">
        <div class="card card-lowlife border-0 shadow-sm mb-4">
          <div class="card-body p-4">
            <h4 class="mb-4">Información de la Cuenta</h4>
            
            <div class="mb-4">
              <label class="form-label text-muted small fw-bold">Nombre Completo</label>
              <input type="text" class="form-control form-control-underline" [(ngModel)]="user.nombre" name="nombre" required>
            </div>

            <div class="mb-4">
              <label class="form-label text-muted small fw-bold">Correo Electrónico</label>
              <input type="email" class="form-control form-control-underline" [(ngModel)]="user.email" name="email" required>
            </div>

            <!-- Nuevos campos añadidos: Dirección, País y Teléfono -->
            <div class="mb-4">
              <label class="form-label text-muted small fw-bold">Dirección</label>
              <input type="text" class="form-control form-control-underline" [(ngModel)]="user.direccion" name="direccion">
            </div>

            <div class="row">
              <div class="col-md-6 mb-4">
                <label class="form-label text-muted small fw-bold">País</label>
                <input type="text" class="form-control form-control-underline" [(ngModel)]="user.pais" name="pais">
              </div>
              <div class="col-md-6 mb-4">
                <label class="form-label text-muted small fw-bold">Teléfono</label>
                <input type="tel" class="form-control form-control-underline" [(ngModel)]="user.telefono" name="telefono">
              </div>
            </div>

            <div class="row">
              <div class="col-md-6 mb-4">
                <label class="form-label text-muted small fw-bold">ID de Usuario</label>
                <input type="text" class="form-control form-control-underline bg-light" [value]="user.id" readonly>
                <small class="text-muted">El ID no puede ser modificado.</small>
              </div>
              <div class="col-md-6 mb-4">
                <label class="form-label text-muted small fw-bold">Último Acceso</label>
                <input type="text" class="form-control form-control-underline bg-light" [value]="user.updated_at | date:'shortDate'" readonly>
              </div>
            </div>
          </div>
        </div>

        <div class="card card-lowlife border-0 shadow-sm mb-4">
          <div class="card-body p-4">
            <h4 class="mb-4">Seguridad y Permisos</h4>
            
            <div class="mb-4">
              <label class="form-label text-muted small fw-bold">Rol del Sistema</label>
              <select class="form-select" [(ngModel)]="user.rol" name="rol">
                <option value="admin">Administrador</option>
                <option value="usuario">Usuario Estándar</option>
              </select>
              <small class="text-muted mt-2 d-block">Define el nivel de acceso que tendrá este usuario en la plataforma.</small>
            </div>
          </div>
        </div>
      </div>

      <!-- Columna Lateral -->
      <div class="col-lg-4">
        <div class="card card-lowlife border-0 shadow-sm mb-4">
          <div class="card-body p-4 text-center">
            <h4 class="mb-4 text-start">Perfil</h4>
            <div class="mb-4">
              <div class="bg-light rounded-circle d-inline-flex justify-content-center align-items-center mb-3" style="width: 120px; height: 120px; overflow: hidden;">
                <!-- Si hay un previewUrl se muestra primero, si no, la foto del usuario. Si ninguna existe, icono por defecto -->
                <img *ngIf="previewUrl || user.foto_perfil" [src]="previewUrl || user.foto_perfil" alt="Perfil" style="width: 100%; height: 100%; object-fit: cover;">
                <i *ngIf="!(previewUrl || user.foto_perfil)" class="bi bi-person text-secondary" style="font-size: 4rem;"></i>
              </div>
              <h5 class="fw-bold mb-1">{{ user.nombre }}</h5>
              <p class="text-muted small mb-0">{{ user.email }}</p>
            </div>
            <!-- Input de archivo oculto conectado al botón -->
            <input type="file" id="fileInput" (change)="onFileSelected($event)" accept="image/*" class="d-none">
            <label for="fileInput" class="btn btn-outline-dark btn-sm w-100 mb-2">Subir Foto (Archivo local)</label>

            <!-- Campo de texto alternativo para pegar la URL de una imagen -->
            <div class="mt-2 text-start">
              <label class="form-label text-muted small fw-bold">O URL de la imagen:</label>
              <!-- Enlazamos con user.foto_perfil. Al cambiar, limpiamos cualquier archivo local que se hubiera seleccionado -->
              <input type="url" class="form-control form-control-sm form-control-underline" 
                     [(ngModel)]="user.foto_perfil" name="foto_perfil_url" 
                     placeholder="https://ejemplo.com/foto.jpg" (input)="onUrlChanged()">
            </div>
          </div>
        </div>

        <div class="card card-lowlife border-0 shadow-sm mb-4">
          <div class="card-body p-4">
            <h4 class="mb-4">Acciones Críticas</h4>
            <div class="d-grid gap-2">
              <button type="button" class="btn btn-outline-danger fw-bold" (click)="deleteUser()">Eliminar Usuario</button>
            </div>
          </div>
        </div>

        <div class="d-grid gap-2">
          <button type="submit" class="btn btn-primary btn-lg fw-bold">Guardar Cambios</button>
          <button type="button" class="btn btn-outline-secondary fw-bold" routerLink="/admin-gestionUsuario">Cancelar</button>
        </div>
      </div>
    </div>
  </form>
</div>
