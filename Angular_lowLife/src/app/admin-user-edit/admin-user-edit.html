<div class="container my-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="fw-bold mb-0">Editar Usuario</h1>
    <a routerLink="/admin-gestionUsuario" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-2"></i>Volver</a>
  </div>

  <form (ngSubmit)="saveChanges()">
    <div class="row g-4">
      <!-- Columna Principal -->
      <div class="col-lg-8">
        <div class="card card-lowlife border-0 shadow-sm mb-4">
          <div class="card-body p-4">
            <h4 class="mb-4">Información de la Cuenta</h4>
            
            <div class="mb-4">
              <label class="form-label text-muted small fw-bold">Nombre Completo</label>
              <input type="text" class="form-control form-control-underline" [(ngModel)]="user.name" name="name" required>
            </div>

            <div class="mb-4">
              <label class="form-label text-muted small fw-bold">Correo Electrónico</label>
              <input type="email" class="form-control form-control-underline" [(ngModel)]="user.email" name="email" required>
            </div>

            <div class="row">
              <div class="col-md-6 mb-4">
                <label class="form-label text-muted small fw-bold">ID de Usuario</label>
                <input type="text" class="form-control form-control-underline bg-light" [value]="user.id" readonly>
                <small class="text-muted">El ID no puede ser modificado.</small>
              </div>
              <div class="col-md-6 mb-4">
                <label class="form-label text-muted small fw-bold">Último Acceso</label>
                <input type="text" class="form-control form-control-underline bg-light" [value]="user.lastLogin" readonly>
              </div>
            </div>
          </div>
        </div>

        <div class="card card-lowlife border-0 shadow-sm mb-4">
          <div class="card-body p-4">
            <h4 class="mb-4">Seguridad y Permisos</h4>
            
            <div class="mb-4">
              <label class="form-label text-muted small fw-bold">Rol del Sistema</label>
              <select class="form-select" [(ngModel)]="user.role" name="role">
                <option value="Admin">Administrador</option>
                <option value="Editor">Editor</option>
                <option value="Usuario">Usuario Estándar</option>
              </select>
              <small class="text-muted mt-2 d-block">Define el nivel de acceso que tendrá este usuario en la plataforma.</small>
            </div>

            <div class="mb-0">
              <label class="form-label text-muted small fw-bold d-block mb-3">Estado de la Cuenta</label>
              <div class="d-flex gap-4">
                <div class="form-check">
                  <input class="form-check-input" type="radio" name="status" id="statusActive" value="Activo" [(ngModel)]="user.status">
                  <label class="form-check-label" for="statusActive">
                    <span class="badge bg-success-subtle text-success-emphasis border border-success-subtle px-3 py-2">Activo</span>
                  </label>
                </div>
                <div class="form-check">
                  <input class="form-check-input" type="radio" name="status" id="statusInactive" value="Inactivo" [(ngModel)]="user.status">
                  <label class="form-check-label" for="statusInactive">
                    <span class="badge bg-danger-subtle text-danger-emphasis border border-danger-subtle px-3 py-2">Inactivo</span>
                  </label>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Columna Lateral -->
      <div class="col-lg-4">
        <div class="card card-lowlife border-0 shadow-sm mb-4">
          <div class="card-body p-4 text-center">
            <h4 class="mb-4 text-start">Perfil</h4>
            <div class="mb-4">
              <div class="bg-light rounded-circle d-inline-flex justify-content-center align-items-center mb-3" style="width: 120px; height: 120px;">
                <i class="bi bi-person text-secondary" style="font-size: 4rem;"></i>
              </div>
              <h5 class="fw-bold mb-1">{{ user.name }}</h5>
              <p class="text-muted small mb-0">{{ user.email }}</p>
            </div>
            <button type="button" class="btn btn-outline-dark btn-sm w-100 mb-2">Cambiar Foto</button>
            <button type="button" class="btn btn-outline-danger btn-sm w-100">Restablecer Contraseña</button>
          </div>
        </div>

        <div class="card card-lowlife border-0 shadow-sm mb-4">
          <div class="card-body p-4">
            <h4 class="mb-4">Acciones Críticas</h4>
            <div class="d-grid gap-2">
              <button type="button" class="btn btn-outline-warning fw-bold">Suspender Cuenta</button>
              <button type="button" class="btn btn-outline-danger fw-bold">Eliminar Usuario</button>
            </div>
          </div>
        </div>

        <div class="d-grid gap-2">
          <button type="submit" class="btn btn-primary btn-lg fw-bold">Guardar Cambios</button>
          <button type="button" class="btn btn-outline-secondary fw-bold" routerLink="/admin-gestionUsuario">Cancelar</button>
        </div>
      </div>
    </div>
  </form>
</div>
