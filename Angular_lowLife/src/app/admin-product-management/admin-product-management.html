<div class="container my-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="fw-bold mb-0">Panel de Administración</h1>
    <!-- Botón Añadir Producto que lleva a la creación -->
    <button class="btn btn-dark px-4 py-2" routerLink="/admin-crearProducto">
      <i class="bi bi-plus-lg me-2"></i>Crear Producto
    </button>
  </div>

  <div class="card card-lowlife border-0 shadow-sm">
    <div class="card-header bg-white border-bottom p-4">
      <h3 class="mb-0">Gestión de Productos</h3>
    </div>
    
    <div class="card-body p-4 bg-light-subtle">
      <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 row-cols-xl-4 g-4">
        <div class="col" *ngFor="let product of products">
          <div class="product-admin-card h-100 shadow-sm border-0 rounded-3 overflow-hidden bg-white">
            <div class="product-image-container position-relative">
              <img [src]="product.image" [alt]="product.name" class="img-fluid w-100" style="height: 200px; object-fit: cover;">
              <div class="position-absolute top-0 start-0 m-2">
                <span class="badge bg-dark opacity-75">#{{ product.id }}</span>
              </div>
              <div class="position-absolute top-0 end-0 m-2">
                <span class="badge" 
                  [ngClass]="{
                    'bg-success': product.status === 'Activo',
                    'bg-danger': product.status === 'Agotado'
                  }">
                  {{ product.status }}
                </span>
              </div>
            </div>
            
            <div class="p-3">
              <div class="d-flex justify-content-between align-items-start mb-2">
                <h5 class="card-title fw-bold mb-0 text-truncate" style="max-width: 70%;">{{ product.name }}</h5>
                <span class="fw-bold text-primary">{{ product.price }}</span>
              </div>
              
              <div class="mb-3">
                <span class="badge-category small">{{ product.category }}</span>
              </div>

              <div class="d-flex align-items-center mb-3">
                <div class="me-2 text-muted small">
                  <i class="bi bi-stack me-1"></i>Stock:
                </div>
                <span class="fw-medium small" [ngClass]="{'text-danger': product.stock === 0, 'text-warning': product.stock > 0 && product.stock <= 10}">
                  {{ product.stock }} unidades
                </span>
              </div>

              <div class="d-flex gap-2">
                <button class="btn btn-outline-dark btn-sm flex-grow-1" [routerLink]="['/admin-editarProducto', product.id]">
                  <i class="bi bi-pencil me-1"></i> Editar
                </button>
                <button class="btn btn-outline-danger btn-sm px-3">
                  <i class="bi bi-trash"></i>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    
    <div class="card-footer bg-white border-top p-4 d-flex justify-content-between align-items-center">
      <span class="text-muted small">Mostrando {{ products.length }} productos</span>
      <nav aria-label="Page navigation">
        <ul class="pagination pagination-sm mb-0">
          <li class="page-item disabled">
            <a class="page-link" href="#" tabindex="-1" aria-disabled="true">Anterior</a>
          </li>
          <li class="page-item active" aria-current="page"><a class="page-link" href="#">1</a></li>
          <li class="page-item"><a class="page-link" href="#">2</a></li>
          <li class="page-item">
            <a class="page-link" href="#">Siguiente</a>
          </li>
        </ul>
      </nav>
    </div>
  </div>
</div>
