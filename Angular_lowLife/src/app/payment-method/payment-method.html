<section class="payment-section">
  <div class="container d-flex flex-column justify-content-center align-items-center h-100 py-5">
    
    <h1 class="fw-bold mb-3">Método de pago</h1>
    <!-- Mostrar el total dinámicamente usando la variable 'total' del componente. Se usa el pipe 'number' para formatear con 2 decimales -->
    <h3 class="fw-normal mb-4" style="font-size: 1.5rem;">Total: {{ total | number:'1.2-2' }}€</h3>

    <div class="payment-card shadow">
      <div class="payment-card-header text-center py-2 d-flex justify-content-center align-items-center gap-3">
        <span class="visa-logo text-info fw-bold fst-italic fs-5" style="color: #1DA1F2 !important;">VISA</span>
        <i class="bi bi-cc-mastercard fs-5 text-white"></i>
        <i class="bi bi-cc-amex fs-5 text-white"></i>
      </div>
      
      <div class="payment-card-body p-4 p-md-5">
        <!-- Añadimos #paymentForm="ngForm" para manejar la validación general del formulario -->
        <form #paymentForm="ngForm" (ngSubmit)="procesarPago()">
          <!-- Número de tarjeta -->
          <div class="mb-4">
            <!-- Validación: obligatorio y patrón de 16 dígitos numéricos -->
            <input type="text" class="form-control form-control-underline" name="numeroTarjeta" [(ngModel)]="cardData.numero" placeholder="Número de tarjeta (16 dígitos)" required pattern="^\d{16}$" maxlength="16">
            <!-- Mensaje de error para número de tarjeta -->
            <small class="text-danger" *ngIf="paymentForm.controls['numeroTarjeta']?.invalid && paymentForm.controls['numeroTarjeta']?.touched">El número debe tener 16 dígitos.</small>
          </div>

          <!-- Fecha y Código -->
          <div class="row mb-4">
            <div class="col-6">
              <!-- Validación: obligatorio y patrón MM/YY (mes 01-12, año de 2 dígitos) -->
              <input type="text" class="form-control form-control-underline" name="fechaExpiracion" [(ngModel)]="cardData.fecha" placeholder="Fecha de expiración (MM/YY)" required pattern="^(0[1-9]|1[0-2])\/\d{2}$" maxlength="5">
              <!-- Mensaje de error -->
              <small class="text-danger" *ngIf="paymentForm.controls['fechaExpiracion']?.invalid && paymentForm.controls['fechaExpiracion']?.touched">Formato MM/YY requerido.</small>
            </div>
            <div class="col-6">
              <!-- Validación: obligatorio y patrón de 3 o 4 dígitos para el CVV -->
              <input type="text" class="form-control form-control-underline" name="cvv" [(ngModel)]="cardData.cvv" placeholder="Código de seguridad (CVV)" required pattern="^\d{3,4}$" maxlength="4">
              <!-- Mensaje de error -->
              <small class="text-danger" *ngIf="paymentForm.controls['cvv']?.invalid && paymentForm.controls['cvv']?.touched">El CVV debe tener 3 o 4 dígitos.</small>
            </div>
          </div>

          <!-- Titular -->
          <div class="mb-4">
            <!-- Validación: obligatorio -->
            <input type="text" class="form-control form-control-underline" name="titular" [(ngModel)]="cardData.titular" placeholder="Titular de la tarjeta" required minlength="3">
            <!-- Mensaje de error -->
            <small class="text-danger" *ngIf="paymentForm.controls['titular']?.invalid && paymentForm.controls['titular']?.touched">El nombre es obligatorio.</small>
          </div>

          <!-- Recordar -->
          <div class="form-check mb-4 d-flex align-items-center">
            <input class="form-check-input check-custom me-2 mt-0" type="checkbox" name="recordar" [(ngModel)]="cardData.recordar" id="recordarPago">
            <label class="form-check-label text-muted" style="font-size: 0.9rem;" for="recordarPago">
              Recordar para mi próximo pago
            </label>
          </div>

          <!-- Confirmar -->
          <!-- Deshabilitamos el botón si paymentForm.invalid es true -->
          <button type="submit" class="btn btn-danger w-100 mb-3 rounded-1 fw-semibold shadow-sm btn-confirmar" style="background-color: #df3a2a; border-color: #c9322a;" [disabled]="paymentForm.invalid">Confirmar</button>
          
          <!-- Volver -->
          <div class="text-center">
            <!-- Enlace actualizado para volver a la dirección de envío antes del carrito -->
            <a routerLink="/direccion-envio" class="text-dark text-decoration-underline text-muted" style="font-size: 0.95rem; cursor: pointer;">Volver a los datos de envío</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</section>
