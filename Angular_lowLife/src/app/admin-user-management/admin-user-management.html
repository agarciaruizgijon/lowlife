<div class="container my-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="fw-bold mb-0">Panel de Administración</h1>
    <!-- Botón Añadir Usuario eliminado -->
  </div>

  <div class="card card-lowlife border-0 shadow-sm">
    <div class="card-header bg-white border-bottom p-4">
      <h3 class="mb-0">Gestión de Usuarios</h3>
    </div>
    
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th scope="col" class="ps-4">ID</th>
              <th scope="col">Nombre</th>
              <th scope="col">Email</th>
              <th scope="col">Rol</th>
              <th scope="col">Estado</th>
              <th scope="col">Último Acceso</th>
              <th scope="col" class="text-end pe-4">Acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let user of users">
              <td class="ps-4 fw-medium text-muted">#{{ user.id }}</td>
              <td>
                <div class="d-flex align-items-center">
                  <div class="bg-light rounded-circle d-flex justify-content-center align-items-center me-3" style="width: 40px; height: 40px;">
                    <i class="bi bi-person text-secondary"></i>
                  </div>
                  <span class="fw-semibold">{{ user.name }}</span>
                </div>
              </td>
              <td class="text-muted">{{ user.email }}</td>
              <td>
                <span class="badge" 
                  [ngClass]="{
                    'bg-primary text-white': user.role === 'Admin',
                    'bg-light text-dark border': user.role !== 'Admin'
                  }">
                  {{ user.role }}
                </span>
              </td>
              <td>
                <span class="badge px-3 py-2" 
                  [ngClass]="{
                    'bg-success-subtle text-success-emphasis fw-bold border border-success-subtle': user.status === 'Activo',
                    'bg-danger-subtle text-danger-emphasis fw-bold border border-danger-subtle': user.status === 'Inactivo'
                  }">
                  {{ user.status }}
                </span>
              </td>
              <td class="text-muted small">{{ user.lastLogin }}</td>
              <td class="text-end pe-4">
                <button class="btn btn-sm btn-outline-secondary me-2"><i class="bi bi-pencil"></i></button>
                <button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
    
    <div class="card-footer bg-white border-top p-4 d-flex justify-content-between align-items-center">
      <span class="text-muted small">Mostrando {{ users.length }} usuarios</span>
      <nav aria-label="Page navigation">
        <ul class="pagination pagination-sm mb-0">
          <li class="page-item disabled">
            <a class="page-link" href="#" tabindex="-1" aria-disabled="true">Anterior</a>
          </li>
          <li class="page-item active" aria-current="page"><a class="page-link" href="#">1</a></li>
          <li class="page-item"><a class="page-link" href="#">2</a></li>
          <li class="page-item">
            <a class="page-link" href="#">Siguiente</a>
          </li>
        </ul>
      </nav>
    </div>
  </div>
</div>
