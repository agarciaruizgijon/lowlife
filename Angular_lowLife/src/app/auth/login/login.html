<!-- Login Section -->
<section class="login-section">
  <div class="container d-flex justify-content-center align-items-center">
    <div class="login-card">
      <h2 class="text-center mb-4 fw-bold">Iniciar Sesión</h2>

      <form>
        <!-- Usuario / Correo -->
        <div class="mb-4">
          <input
            type="text"
            class="form-control form-control-underline"
            id="loginUser"
            placeholder="Usuario / Correo electronico"
          />
        </div>

        <!-- Contraseña -->
        <div class="mb-4">
          <input
            type="password"
            class="form-control form-control-underline"
            id="loginPassword"
            placeholder="Contraseña"
          />
        </div>

        <!-- Botón Acceder -->
        <button type="submit" class="btn btn-primary w-100 mb-3 btn-acceder">Acceder</button>
      </form>

      <!-- Botones de redes sociales -->
      <div class="d-flex gap-2 social-buttons">
        <button class="btn btn-social btn-google flex-fill">
          <i class="bi bi-google"></i>
        </button>
        <button class="btn btn-social btn-apple flex-fill">
          <i class="bi bi-apple"></i>
        </button>
        <button class="btn btn-social btn-facebook flex-fill">
          <i class="bi bi-facebook"></i>
        </button>
        <button class="btn btn-social btn-x flex-fill">
          <i class="bi bi-twitter-x"></i>
        </button>
      </div>
    </div>
  </div>
</section>
